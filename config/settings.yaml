runtime:
  python_executable: "C:/Users/Billy/Documents/.venv/Scripts/python.exe"
  python_version: "3.12.10"
  device: "auto"  # Prefer a working CUDA GPU; otherwise use CPU.

project:
  group_id: "G090"
  subject: "Computer Architecture"

sources:
  book_manifest: "data/book_manifest.json"
  pdf_directory: "."
  excluded_directories:
    - "ignored"
    - "output"
    - "tmp"
  ocr_enabled: false

embedding:
  model_name: "BAAI/bge-small-en-v1.5"
  revision: "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
  batch_size: 8
  normalize: true
  document_prefix: ""
  query_prefix: "Represent this sentence for searching relevant passages: "
  include_section: false

generation:
  model_id: null
  revision: null

ingestion:
  minimum_text_characters: 40

chunking:
  size_tokens: 400
  overlap_tokens: 50

retrieval:
  top_k: 5
  index_type: "IndexFlatIP"
  index_directory: "artifacts/index"

paths:
  extracted_directory: "data/extracted"
  ingestion_report: "evaluation/ingestion_report.json"
  passages: "data/passages.jsonl"
  evaluation_questions: "data/evaluation_questions.json"
  evaluation_directory: "evaluation"
